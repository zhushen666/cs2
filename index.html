    ["panel", "docs", "data", "code"].forEach(function (t) {
      var sec = $("tab-" + t);
      if (sec) sec.hidden = (t !== name);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#mainTabs .tab"), function (b) {
      if (b.getAttribute("data-tab") === name) b.classList.add("active");
      else b.classList.remove("active");
    });
    if (name === "panel" && state.data) renderCharts(state.data);
    if (name === "docs") renderDocs();
    if (name === "data") renderData();
    if (name === "code") renderCode();
  }

  function renderLanBox() {
    var url = window.__LAN_URL__;
    var box = $("lanBox");
    if (!box) return;
    if (!url) { box.hidden = true; return; }
    var qr = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=" + encodeURIComponent(url);
    box.innerHTML =
      '<img src="' + qr + '" alt="手机访问二维码" width="132" height="132">' +
      '<div><div class="small muted">手机实时查看（手机与本机连同一个 Wi-Fi）</div>' +
      '<div class="url">' + esc(url) + '</div>' +
      '<div class="small muted" style="margin-top:4px">用手机相机或微信扫左边的二维码，也可以直接在手机浏览器输入上面的地址。</div></div>';
    box.hidden = false;
  }

  function renderPlans(d) {
    var p = d.position || { range: "—", text: "", levels: {} };
    var lv = p.levels || {};
    function n(v, dg) { return (v === undefined || v === null || isNaN(v)) ? "—" : Number(v).toFixed(dg); }
    $("planHead").innerHTML =
      '<div><div class="small muted">当前建议仓位</div><div class="big">' + esc(p.range) + '</div></div>' +
      '<div class="small muted" style="flex:1;min-width:220px">' + esc(p.text) + '</div>' +
      '<div class="small muted">近 24h 支撑 <b>' + n(lv.support, 1) + '</b>｜压力 <b>' + n(lv.resistance, 1) +
      '</b>｜止损 <b>' + n(lv.stop, 0) + '</b>｜目标 <b>' + n(lv.target1, 1) + ' / ' + n(lv.target2, 1) + '</b></div>';
    var html = '<thead><tr><th>方向</th><th>触发条件</th><th>动作</th><th>当前状态</th></tr></thead><tbody>';
    (d.plans || []).forEach(function (pl) {
      var tag = pl.side === "buy" ? '<span class="tag-buy">买入点</span>' : '<span class="tag-sell">卖出点</span>';
      var st = pl.active ? '<span class="pill good">已触发</span>' : '<span class="pill neutral">未触发</span>';
      html += '<tr><td>' + tag + '</td><td><b>' + esc(pl.name) + '</b><div class="small muted">' + esc(pl.trigger) + '</div></td>' +
        '<td>' + esc(pl.size) + '</td>' +
        '<td>' + st + '<div class="small muted">' + esc(pl.now) + '</div></td></tr>';
    });
    $("tblPlans").innerHTML = html + '</tbody>';
    $("planNote").innerHTML = '<b>怎么用：</b>买入点全部未触发时，仓位保持在 0～10%（这就是当前状态）；' +
      '只有①②同时成立才启动试仓，③④用来确认加仓，卖出点任一条触发即执行减仓，' +
      '其中<b>止损线优先于一切买入信号</b>。价位由近 24 小时支撑/压力与区间高度推导，会随数据自动更新。';
  }

  function renderInsights(d) {
    $("insights").innerHTML = d.insights.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    $("rules").innerHTML = d.rules;
  }

  function svgLine(cfg) {
    var svg = $(cfg.id);
    if (!svg) return;
    var w = Math.max(300, Math.round(svg.clientWidth || svg.parentElement.clientWidth || 640));
    var h = cfg.height || 220;
    var m = { t: 16, r: cfg.right || 58, b: 34, l: cfg.left || 54 };
    var iw = Math.max(60, w - m.l - m.r), ih = h - m.t - m.b;
    var series = cfg.series;
    if (!series.length || !series[0] || !series[0].points.length) { svg.innerHTML = ""; return; }
    var xs = series[0].points.map(function (p) { return p.x; });
    var ys = [];
    series.forEach(function (s) { s.points.forEach(function (p) { ys.push(p.y); }); });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
    var pad = (hi - lo) * 0.18 || Math.abs(hi) * 0.05 || 1;
    function X(v) { return iw * (v - x0) / ((x1 - x0) || 1); }
    function Y(v) { return ih - ih * ((v - (lo - pad)) / ((hi + pad) - (lo - pad) || 1)); }
    var parts = [];
    var ticks = cfg.yTicks || 4;
    for (var i = 0; i <= ticks; i++) {
      var val = (lo - pad) + ((hi + pad) - (lo - pad)) * i / ticks;
      var yy = Y(val);
      parts.push('<line x1="0" x2="' + iw + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>');
      parts.push('<text x="-8" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + cfg.yFmt(val) + '</text>');
    }
    var xt = cfg.xTicks || 5;
    for (var j = 0; j <= xt; j++) {
      var xv = x0 + (x1 - x0) * j / xt;
      var xx = X(xv);
      parts.push('<line x1="' + xx + '" x2="' + xx + '" y1="' + ih + '" y2="' + (ih + 4) + '" stroke="var(--line)"/>');
      parts.push('<text x="' + xx + '" y="' + (ih + 18) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + cfg.xFmt(xv) + '</text>');
    }
    parts.push('<text x="0" y="-4" font-size="11" fill="var(--muted)">' + cfg.yTitle + '</text>');
    parts.push('<text x="' + iw + '" y="' + (ih + 32) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + cfg.xTitle + '</text>');
    series.forEach(function (s, si) {
      var d = s.points.map(function (p, k) { return (k ? "L" : "M") + X(p.x).toFixed(2) + " " + Y(p.y).toFixed(2); }).join(" ");
      if (s.area) {
        parts.push('<path d="' + d + " L" + iw + " " + ih + " L0 " + ih + ' Z" fill="' + s.color + '" opacity="0.12"/>');
      }
      parts.push('<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + (si ? 1.6 : 2) + '"' +
        (s.dash ? ' stroke-dasharray="5 4"' : '') + ' stroke-linejoin="round"/>');
      var last = s.points[s.points.length - 1];
      parts.push('<circle cx="' + X(last.x) + '" cy="' + Y(last.y) + '" r="3" fill="' + s.color + '"/>');
      if (s.label) parts.push('<text x="' + (X(last.x) + 6) + '" y="' + (Y(last.y) + 4) + '" font-size="11" fill="var(--fg)">' + s.label + '</text>');
    });
    parts.push('<line id="' + cfg.id + '-guide" x1="0" x2="0" y1="0" y2="' + ih + '" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>');
    parts.push('<rect id="' + cfg.id + '-hit" x="0" y="0" width="' + iw + '" height="' + ih + '" fill="transparent"/>');
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("height", h);
    svg.innerHTML = '<g transform="translate(' + m.l + "," + m.t + ')">' + parts.join("") + "</g>";

    var hit = $(cfg.id + "-hit");
    var guide = $(cfg.id + "-guide");
    if (!hit) return;
    hit.addEventListener("pointermove", function (evt) {
      var rect = hit.getBoundingClientRect();
      var ratio = Math.max(0, Math.min(1, (evt.clientX - rect.left) / (rect.width || 1)));
      var idx = Math.round(ratio * (series[0].points.length - 1));
      var p = series[0].points[idx];
      guide.setAttribute("x1", X(p.x));
      guide.setAttribute("x2", X(p.x));
      guide.setAttribute("opacity", "0.55");
      var hint = $(cfg.hintId);
      if (hint) hint.textContent = cfg.hover(p, idx);
    });
    hit.addEventListener("pointerleave", function () {
      guide.setAttribute("opacity", "0");
      var hint = $(cfg.hintId);
      if (hint) hint.textContent = cfg.idle;
    });
  }

  function renderCharts(d) {
    var idxPts = d.index.series.map(function (p) { return { x: p.t, y: p.v }; });
    svgLine({
      id: "chartIndex", hintId: "hintIndex", height: 250, yTitle: "指数（点）", xTitle: "北京时间",
      yFmt: function (v) { return v.toFixed(0); },
      xFmt: function (v) { return new Date(v * 1000).toTimeString().slice(0, 5); },
      xTicks: 5, yTicks: 4, right: 62,
      series: [{ points: idxPts, color: "var(--accent)", area: true, label: fmtInt(d.index.current) }],
      hover: function (p, i) { return d.index.series[i].label + "　" + p.y.toFixed(2) + " 点"; },
      idle: "把鼠标移到曲线上查看逐小时点位"
    });
    svgLine({
      id: "chartTrade", hintId: "hintTrade", height: 220, yTitle: "成交额（万元）", xTitle: "日期",
      yFmt: function (v) { return Math.round(v).toLocaleString("en-US"); },
      xFmt: function (v) { var dt = new Date(v); return ("0" + (dt.getMonth() + 1)).slice(-2) + "-" + ("0" + dt.getDate()).slice(-2); },
      xTicks: 4, yTicks: 4,
      series: [{ points: d.trade.series.map(function (p) { return { x: p.t, y: p.a / 1e4 }; }), color: "var(--accent)", area: true, label: (d.trade.series[d.trade.series.length - 1].a / 1e4).toFixed(0) }],
      hover: function (p, i) { var r = d.trade.series[i]; return r.d + "　成交额 " + fmtMoney(r.a) + "　" + fmtInt(r.c) + " 笔"; },
      idle: "把鼠标移到曲线上查看单日数据"
    });
    svgLine({
      id: "chartOnline", hintId: "hintOnline", height: 220, yTitle: "在线人数（万人）", xTitle: "日期",
      yFmt: function (v) { return Math.round(v).toLocaleString("en-US"); },
      xFmt: function (v) { var dt = new Date(v); return ("0" + (dt.getMonth() + 1)).slice(-2) + "-" + ("0" + dt.getDate()).slice(-2); },
      xTicks: 4, yTicks: 4,
      series: [
        { points: d.online.series.map(function (p) { return { x: p.t, y: p.peak / 1e4 }; }), color: "var(--accent)", label: "峰 " + (d.online.series[d.online.series.length - 1].peak / 1e4).toFixed(1) },
        { points: d.online.series.map(function (p) { return { x: p.t, y: p.avg / 1e4 }; }), color: "var(--muted)", dash: true, label: "均 " + (d.online.series[d.online.series.length - 1].avg / 1e4).toFixed(1) }
      ],
      hover: function (p, i) { var r = d.online.series[i]; return r.d + "　峰值 " + fmtInt(r.peak) + "　均值 " + fmtInt(r.avg); },
      idle: "实线＝当日峰值　虚线＝当日均值"
    });
  }

  function render(d) {
    state.data = d;
    $("subtitle").innerHTML = "数据源 steamdt.com　·　指数更新于 <b>" + esc(d.data_time) + "</b>　·　本次抓取 " + esc(d.generated_at) +
      (d.stale ? '　<span class="pill warn">缓存数据</span>' : "");
    var alertBox = $("alert");
    if (d.notice) { alertBox.hidden = false; alertBox.textContent = d.notice; }
    else { alertBox.hidden = true; }
    renderVerdict(d); renderSignals(d); renderKpis(d); renderPlans(d); renderTables(d); renderInsights(d); renderCharts(d);
    var dataTab = $("tab-data");
    if (dataTab && !dataTab.hidden) renderData();
    $("foot").textContent = d.footnote;
  }

  function setDot(cls, title) {
    var dot = $("liveDot");
    dot.className = "dot " + cls;
    dot.title = title;
  }

  async function load(force) {
    if (STATIC) {
      render(STATIC);
      setDot("live", HOSTED ? "在线（自动刷新数据文件）" : "静态快照");
      if (!HOSTED) {
        $("autoRefresh").checked = false;
        $("autoRefresh").disabled = true;
        $("refreshBtn").disabled = true;
        $("subtitle").innerHTML += '　<span class="pill neutral">静态快照</span>';
        return;
      }
      try {
        var res0 = await fetch("./dashboard_payload.json?t=" + Date.now(), { cache: "no-store" });
        if (res0.ok) { render(await res0.json()); }
      } catch (err0) {
        var box0 = $("alert");
        box0.hidden = false;
        box0.textContent = "暂时拿不到最新数据（" + err0 + "），当前显示页面内置的那一份。";
      }
      return;
    }
    if (state.loading) return;
    state.loading = true;
    $("refreshBtn").disabled = true;
    try {
      var res = await fetch("/api/snapshot" + (force ? "?refresh=1" : ""), { cache: "no-store" });
      var data = await res.json();
      render(data);
      setDot(data.stale ? "err" : "live", data.stale ? "上游暂时不可用，显示缓存" : "实时数据已连接");
    } catch (err) {
      setDot("err", "无法连接到本地服务");
      var box = $("alert");
      box.hidden = false;
      box.textContent = "读取数据失败：" + err + "。如果页面是直接双击打开的，请改用 启动大盘面板.cmd 启动本地服务。";
    } finally {
      state.loading = false;
      $("refreshBtn").disabled = false;
    }
  }

  $("refreshBtn").addEventListener("click", function () { load(true); });
  $("autoRefresh").addEventListener("change", function (e) {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
    if (e.target.checked) { state.timer = setInterval(function () { load(true); }, REFRESH_MS); }
  });
  window.addEventListener("resize", function () { if (state.data) renderCharts(state.data); });
  Array.prototype.forEach.call(document.querySelectorAll("#mainTabs .tab"), function (b) {
    b.addEventListener("click", function () { showTab(b.getAttribute("data-tab")); });
  });

  renderLanBox();

  load(false);
  if (!STATIC || HOSTED) { state.timer = setInterval(function () { load(true); }, 5 * 60 * 1000); }
})();
</script>
</body>
</html>
