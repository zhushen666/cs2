<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 饰品大盘面板 · SteamDT</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --line: #e3e6ea;
    --fg: #14181f; --muted: #6b7280; --accent: #2f6df6;
    --up: #d92d20; --down: #14804a; --warn: #b7791f;
    --up-bg: #fdecea; --down-bg: #e8f6ee; --warn-bg: #fdf5e4; --accent-bg: #eaf0ff;
    --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #151b23; --panel-2: #1b232c; --line: #26303b;
      --fg: #e8edf4; --muted: #93a1b1; --accent: #6c93ff;
      --up: #ff6b6b; --down: #3ddc97; --warn: #e3b341;
      --up-bg: #33191b; --down-bg: #12301f; --warn-bg: #2f2713; --accent-bg: #16233d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", Roboto, sans-serif;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 18px 48px; }
  header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 21px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .mono { font-variant-numeric: tabular-nums; }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  .switch { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.live { background: var(--down); box-shadow: 0 0 0 3px var(--down-bg); }
  .dot.err { background: var(--up); box-shadow: 0 0 0 3px var(--up-bg); }
  .alert { padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); margin-bottom: 14px; font-size: 13px; }
  .grid { display: grid; gap: 12px; margin-bottom: 14px; }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .grid-6 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); margin-bottom: 14px; }
  .verdict .level { font-size: 22px; font-weight: 600; }
  .verdict .level.bad { color: var(--up); }
  .verdict .level.warn { color: var(--warn); }
  .verdict .level.good { color: var(--down); }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid transparent; white-space: nowrap; }
  .pill.good { background: var(--down-bg); color: var(--down); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--up-bg); color: var(--up); }
  .pill.neutral { background: var(--panel-2); color: var(--muted); }
  .signal .name { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .signal .value { font-size: 20px; font-weight: 600; margin: 8px 0 2px; }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 19px; font-weight: 600; margin: 4px 0 2px; }
  .charts { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 14px; }
  @media (min-width: 1000px) { .charts { grid-template-columns: 1fr 1fr; } .charts .wide { grid-column: span 2; } }
  svg.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; min-height: 18px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  thead th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  ul.insights { margin: 0; padding-left: 20px; }
  ul.insights li { margin-bottom: 6px; }
  .rules { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
  .plan-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); margin-bottom: 12px; }
  .plan-head .big { font-size: 20px; font-weight: 600; }
  .tag-buy, .tag-sell { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .tag-buy { background: var(--accent-bg); color: var(--accent); }
  .tag-sell { background: var(--warn-bg); color: var(--warn); }
  footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
  .scroll { overflow-x: auto; }
  .lanbox { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--accent-bg); margin-bottom: 14px; }
  .lanbox img { width: 132px; height: 132px; border-radius: 8px; background: #fff; padding: 4px; }
  .lanbox .url { font-family: ui-monospace, Consolas, monospace; font-size: 15px; font-weight: 600; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; font: inherit; }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  pre.code { max-height: 62vh; overflow: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.55; white-space: pre; font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .docs h1 { font-size: 20px; margin: 18px 0 10px; }
  .docs h2 { font-size: 16px; margin: 18px 0 8px; }
  .docs h3 { font-size: 14px; margin: 14px 0 6px; }
  .docs p, .docs li { font-size: 13.5px; }
  .docs code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
  .docs blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel-2); color: var(--muted); border-radius: 0 8px 8px 0; }
  .docs table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 14px; }
  .docs th, .docs td { border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; text-align: left; }
  .docs a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="mainTabs" aria-label="内容切换">
    <button class="tab active" type="button" data-tab="panel">大盘面板</button>
    <button class="tab" type="button" data-tab="docs">使用说明</button>
    <button class="tab" type="button" data-tab="data">数据明细</button>
    <button class="tab" type="button" data-tab="code">面板源码</button>
  </nav>

  <section id="tab-panel">
  <header class="top">
    <div>
      <h1>CS2 饰品大盘面板</h1>
      <p class="small muted" id="subtitle">正在加载数据…</p>
    </div>
    <div class="actions">
      <span class="dot" id="liveDot" title="数据连接状态"></span>
      <label class="switch"><input type="checkbox" id="autoRefresh" checked> 自动刷新（5 分钟）</label>
      <button id="refreshBtn" type="button">立即刷新</button>
    </div>
  </header>

  <div class="alert" id="alert" hidden></div>
  <section class="verdict" id="verdict"></section>
  <section class="grid grid-4" id="signals"></section>
  <section class="grid grid-6" id="kpis"></section>
  <div id="lanBox" class="lanbox" hidden></div>

  <section class="charts">
    <div class="card wide">
      <h2>大盘指数 · 近 24 小时</h2>
      <svg class="chart" id="chartIndex" role="img" aria-label="大盘指数近 24 小时走势"></svg>
      <p class="hint" id="hintIndex">把鼠标移到曲线上查看逐小时点位</p>
    </div>
    <div class="card">
      <h2>全站日成交额 · 近 180 天</h2>
      <svg class="chart" id="chartTrade" role="img" aria-label="日成交额近 180 天走势"></svg>
      <p class="hint" id="hintTrade">把鼠标移到曲线上查看单日数据</p>
    </div>
    <div class="card">
      <h2>在线人数 · 近 180 天</h2>
      <svg class="chart" id="chartOnline" role="img" aria-label="在线人数近 180 天走势"></svg>
      <p class="hint" id="hintOnline">实线＝当日峰值　虚线＝当日均值</p>
    </div>
  </section>

  <section class="card" style="margin-bottom:14px">
    <h2>结构：品类 · 板块 · 异动</h2>
    <div class="cols">
      <div>
        <h3>七大品类（近 24 小时）</h3>
        <div class="scroll"><table id="tblCats"></table></div>
      </div>
      <div>
        <h3>板块指数涨跌榜（较昨收）</h3>
        <div class="scroll"><table id="tblBlocks"></table></div>
      </div>
      <div>
        <h3>最近价格异动</h3>
        <div class="scroll"><table id="tblChanges"></table></div>
      </div>
    </div>
  </section>

  <section class="card" style="margin-bottom:14px">
    <h2>买卖点计划 · 条件触发（不预测方向，只定义动作）</h2>
    <div id="planHead"></div>
    <div class="scroll"><table id="tblPlans"></table></div>
    <div class="rules" id="planNote"></div>
  </section>

  <section class="card">
    <h2>结论与盯盘清单</h2>
    <ul class="insights" id="insights"></ul>
    <div class="rules" id="rules"></div>
  </section>

  </section>

  <section id="tab-docs" hidden>
    <div class="card docs" id="docsBox"></div>
  </section>

  <section id="tab-data" hidden>
    <div class="card" id="dataBox"></div>
  </section>

  <section id="tab-code" hidden>
    <div class="card" id="codeBox"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>window.__DOCS__ = {"docs": "\u003ch1>CS2 饰品大盘面板（SteamDT 数据）\u003c/h1>\u003cp>一个可以在本机随时打开的大盘面板：会自动抓取 \u003ca href=\"https://www.steamdt.com/\" target=\"_blank\" rel=\"noopener\">steamdt.com\u003c/a> 的公开数据，给出大盘指数、成交、人气、结构，并把“盯盘清单”的 4 个信号自动判成 \u003cb>达标 / 接近 / 未达标\u003c/b>。\u003c/p>\u003ch2>怎么用\u003c/h2>\u003cblockquote>双击请到\u003cb>文件资源管理器\u003c/b>里做：在聊天窗口或编辑器里点文件链接，只会打开它的源码，不会运行。\u003c/blockquote>\u003ch3>方式一：实时面板（推荐，需要联网）\u003c/h3>\u003cp>双击 \u003cb>\u003ccode>CS2大盘面板.lnk\u003c/code>\u003c/b>（或在资源管理器里双击 \u003ccode>start-dashboard.cmd\u003c/code>，或执行 \u003ccode>python steamdt_dashboard.py\u003c/code>）。\u003c/p>\u003cul>\u003cli>会自动打开浏览器：\u003ccode>http://127.0.0.1:8787/\u003c/code>\u003c/li>\u003cli>本地服务负责抓数据（浏览器直连会被跨域拦住，所以由本地服务代抓）\u003c/li>\u003cli>页面每 5 分钟自动刷新一次，也可以点「立即刷新」强制更新\u003c/li>\u003cli>关闭那个黑色命令行窗口即停止服务\u003c/li>\u003cli>换端口：\u003ccode>start-dashboard.cmd 8899\u003c/code> 或 \u003ccode>python steamdt_dashboard.py --port 8899\u003c/code>\u003c/li>\u003c/ul>\u003ch3>方式二：离线快照（不联网也能看）\u003c/h3>\u003cp>双击 \u003cb>\u003ccode>大盘快照（离线看）.lnk\u003c/code>\u003c/b>（或直接双击 \u003ccode>steamdt_dashboard.html\u003c/code>）—— 数据已嵌进页面，不联网也能打开，但停留在导出时刻。\u003c/p>\u003cp>想更新快照：双击 \u003cb>\u003ccode>export-snapshot.cmd\u003c/code>\u003c/b>（或 \u003ccode>python steamdt_dashboard.py --export steamdt_dashboard.html\u003c/code>）。\u003c/p>\u003cp>如果抓取失败（比如断网），可以用最近一次成功的数据重建页面：\u003ccode>python steamdt_dashboard.py --rebuild\u003c/code>。\u003c/p>\u003ch2>手机上查看\u003c/h2>\u003ch3>方式一：手机看离线快照（不需要电脑开着）\u003c/h3>\u003cp>电脑桌面上已经放好一份 \u003cb>\u003ccode>CS2大盘面板（看这个）.html\u003c/code>\u003c/b>，直接用它就行：\u003c/p>\u003col>\u003cli>电脑微信 → 「文件传输助手」→ 把这个文件拖进去发送\u003c/li>\u003cli>手机微信点开该文件 → 右上角「…」→ 用浏览器打开（微信里预览不了就选「用其他应用打开」）\u003c/li>\u003cli>打开后可「添加到主屏幕 / 收藏书签」，以后一点就看\u003c/li>\u003c/ol>\u003cp>另外 OneDrive 里也放了一份 \u003cb>\u003ccode>CS2大盘面板.html\u003c/code>\u003c/b>：手机装上 OneDrive 并登录同一账号，\u003c/p>\u003cp>打开 OneDrive 就能直接看到、点开即看，电脑重新导出后手机会自动同步，完全不用手动传文件。\u003c/p>\u003cp>（邮件附件也可以：发给自己 → 手机邮箱里点「在浏览器中打开」。）\u003c/p>\u003cp>数据是导出那一刻的：在电脑上双击 \u003ccode>export-snapshot.cmd\u003c/code> 就会重新导出，\u003c/p>\u003cp>并自动复制到\u003cb>桌面\u003c/b>和 \u003cb>OneDrive\u003c/b>（对应 \u003ccode>--publish\u003c/code> 参数），手机上刷新或重新打开即可看到最新数据。\u003c/p>\u003ch3>方式二：手机看实时数据（手机和电脑连同一个 Wi-Fi）\u003c/h3>\u003col>\u003cli>电脑上双击 \u003cb>\u003ccode>手机也能看（同一WiFi）.lnk\u003c/code>\u003c/b>（等价于 \u003ccode>start-dashboard-phone.cmd\u003c/code>）\u003c/li>\u003cli>弹出的窗口里会打印一行 \u003cb>手机访问地址\u003c/b>，形如 \u003ccode>http://192.168.1.23:8787/\u003c/code>\u003c/li>\u003cli>手机浏览器输入这个地址即可（页面每 5 分钟自动刷新）\u003c/li>\u003cli>Windows 防火墙首次弹窗要选「允许访问」；电脑上的窗口保持开着，关掉即停止\u003c/li>\u003c/ol>\u003cp>注意：这种方式电脑必须开着，且手机不能连到访客网络或只用移动数据（必须与电脑同一个局域网）。\u003c/p>\u003ch2>页面里的四个页签\u003c/h2>\u003cp>打开的页面顶部有四个页签，点一下就能直接看内容（不需要再点文件链接）：\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>页签\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>大盘面板\u003c/td>\u003ctd>指数、成交、人气、结构、买卖点计划等全部可视化内容\u003c/td>\u003c/tr>\u003ctr>\u003ctd>使用说明\u003c/td>\u003ctd>就是本文件，直接渲染成网页显示\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数据明细\u003c/td>\u003ctd>面板本次使用的完整 JSON，可一键复制或下载\u003c/td>\u003c/tr>\u003ctr>\u003ctd>面板源码\u003c/td>\u003ctd>steamdt_dashboard.py 全文，可一键复制或下载\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>离线快照里这四部分都已经嵌进同一个 HTML 文件，所以双击一个文件就能看到全部内容。\u003c/p>\u003ch2>文件说明\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth>文件\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>CS2大盘面板.lnk\u003c/code>\u003c/td>\u003ctd>一键启动的快捷方式（等价于双击 start-dashboard.cmd）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>大盘快照（离线看）.lnk\u003c/code>\u003c/td>\u003ctd>一键打开离线快照的快捷方式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>steamdt_dashboard.py\u003c/code>\u003c/td>\u003ctd>面板本体（本地服务 + 抓取 + 分析 + 导出），只用 Python 标准库，Python 3.8+\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>start-dashboard.cmd\u003c/code>\u003c/td>\u003ctd>一键启动实时面板并打开浏览器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>export-snapshot.cmd\u003c/code>\u003c/td>\u003ctd>一键导出离线快照\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>steamdt_dashboard.html\u003c/code>\u003c/td>\u003ctd>离线快照（可双击直接看）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dashboard_payload.json\u003c/code>\u003c/td>\u003ctd>面板用到的结构化数据（最新一次）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>steamdt_collector.py\u003c/code>\u003c/td>\u003ctd>只做采集的轻量脚本，输出原始接口数据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>steamdt_market_snapshot.json\u003c/code>\u003c/td>\u003ctd>采集脚本输出的完整快照（含 raw 原始返回）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch2>页面上的 4 个盯盘信号\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth>信号\u003c/th>\u003cth>达标条件\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>① 量能修复\u003c/td>\u003ctd>最近完整交易日成交额 ≥ 近 30 日均值\u003c/td>\u003ctd>没有量，反弹都是修复性的\u003c/td>\u003c/tr>\u003ctr>\u003ctd>② 供给拐点\u003c/td>\u003ctd>七大品类在售量 24h 变化均值 ≤ 0%\u003c/td>\u003ctd>卖盘停止增加，是比价格更早的底部信号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>③ 价格收复\u003c/td>\u003ctd>大盘指数站上 807～810\u003c/td>\u003ctd>收复近两日密集成交区\u003c/td>\u003c/tr>\u003ctr>\u003ctd>④ 人气验证\u003c/td>\u003ctd>在线人数较昨日同时段、上周同时段同时为正\u003c/td>\u003ctd>需求端确认\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>4 条全达标 → 「转强信号出现」；2～3 条 → 「修复中出现分化」；0～1 条 → 「弱势延续」。\u003c/p>\u003ch2>买卖点计划\u003c/h2>\u003cp>面板里有一整块「买卖点计划」，把当前数据算成\u003cb>可执行的价位与动作\u003c/b>（不预测方向，只定义触发条件），并且每条都实时标出「已触发 / 未触发」：\u003c/p>\u003cp>\u003cb>买入点（分批建仓）\u003c/b>\u003c/p>\u003col>\u003cli>试仓买入 30%：指数 ≥ 807 且最近完整日成交额 ≥ 近 30 日均值\u003c/li>\u003cli>加仓确认至 60%：指数 ≥ 810 且七大品类在售量 24h 变化均值 ≤ 0%\u003c/li>\u003cli>趋势加满至 100%：指数连续 3 日站上 810 且在线人数昨日/上周同时段双升\u003c/li>\u003c/ol>\u003cp>\u003cb>卖出点（先减仓后止损）\u003c/b>\u003c/p>\u003col>\u003cli>减仓一半：指数跌破近 24 小时低点\u003c/li>\u003cli>止损离场：指数跌破止损线（近 24h 低点下方约 0.5%，自动取整）\u003c/li>\u003cli>供给恶化减仓至 20%：在售量 24h 均值 &gt; +1.5% 且成交额 &lt; 30 日均值的 80%\u003c/li>\u003cli>分批止盈：站稳 810 后涨 3%，或在售量 24h 均值 &gt; +3%（第一目标＝区间高度 1 倍，第二目标＝2 倍）\u003c/li>\u003c/ol>\u003cp>顶部还会给出\u003cb>当前建议仓位\u003c/b>：4 个信号全达标 → 60%～100%；3 个 → 约 60%；2 个 → 约 30%；1 个 → 0～10%；0 个 → 观望。所有价位都会随数据自动重算。\u003c/p>\u003ch2>数据口径\u003c/h2>\u003cul>\u003cli>数据来自 steamdt.com 的公开接口（\u003ccode>/api/index/...\u003c/code>）与走势页服务端数据，请求需带 \u003ccode>x-device-id\u003c/code>、\u003ccode>x-device\u003c/code>、\u003ccode>x-app-version\u003c/code>、\u003ccode>x-currency\u003c/code>、\u003ccode>language\u003c/code> 等头。\u003c/li>\u003cli>大盘指数以 \u003cb>2023-06-20 = 1000\u003c/b> 为基期，每 5 分钟计算一次，按饰品全网在售数量加权、以最低在售价累计，因此它反映的是\u003cb>挂牌价\u003c/b>而非成交价。\u003c/li>\u003cli>成交额、成交量、在线人数为平台全站采集口径；板块涨跌幅为平台展示口径。\u003c/li>\u003cli>仅供研究参考，不构成投资建议。\u003c/li>\u003c/ul>", "source": "PAGE = r\"\"\"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>CS2 饰品大盘面板 · SteamDT\u003c/title>\n\u003cstyle>\n  :root {\n    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --line: #e3e6ea;\n    --fg: #14181f; --muted: #6b7280; --accent: #2f6df6;\n    --up: #d92d20; --down: #14804a; --warn: #b7791f;\n    --up-bg: #fdecea; --down-bg: #e8f6ee; --warn-bg: #fdf5e4; --accent-bg: #eaf0ff;\n    --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);\n  }\n  @media (prefers-color-scheme: dark) {\n    :root {\n      --bg: #0d1117; --panel: #151b23; --panel-2: #1b232c; --line: #26303b;\n      --fg: #e8edf4; --muted: #93a1b1; --accent: #6c93ff;\n      --up: #ff6b6b; --down: #3ddc97; --warn: #e3b341;\n      --up-bg: #33191b; --down-bg: #12301f; --warn-bg: #2f2713; --accent-bg: #16233d;\n      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);\n    }\n  }\n  * { box-sizing: border-box; }\n  body {\n    margin: 0; background: var(--bg); color: var(--fg);\n    font: 14px/1.55 -apple-system, \"Segoe UI\", \"Microsoft YaHei\", \"PingFang SC\", Roboto, sans-serif;\n  }\n  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 18px 48px; }\n  header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }\n  h1 { font-size: 21px; margin: 0; font-weight: 600; letter-spacing: .2px; }\n  h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }\n  .muted { color: var(--muted); }\n  .small { font-size: 12px; }\n  .mono { font-variant-numeric: tabular-nums; }\n  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n  button {\n    font: inherit; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line);\n    background: var(--panel); color: var(--fg); cursor: pointer;\n  }\n  button:hover { border-color: var(--accent); color: var(--accent); }\n  button:disabled { opacity: .55; cursor: default; }\n  .switch { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }\n  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }\n  .dot.live { background: var(--down); box-shadow: 0 0 0 3px var(--down-bg); }\n  .dot.err { background: var(--up); box-shadow: 0 0 0 3px var(--up-bg); }\n  .alert { padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); margin-bottom: 14px; font-size: 13px; }\n  .grid { display: grid; gap: 12px; margin-bottom: 14px; }\n  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }\n  .grid-6 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }\n  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }\n  .verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--radius);\n    border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); margin-bottom: 14px; }\n  .verdict .level { font-size: 22px; font-weight: 600; }\n  .verdict .level.bad { color: var(--up); }\n  .verdict .level.warn { color: var(--warn); }\n  .verdict .level.good { color: var(--down); }\n  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid transparent; white-space: nowrap; }\n  .pill.good { background: var(--down-bg); color: var(--down); }\n  .pill.warn { background: var(--warn-bg); color: var(--warn); }\n  .pill.bad { background: var(--up-bg); color: var(--up); }\n  .pill.neutral { background: var(--panel-2); color: var(--muted); }\n  .signal .name { display: flex; justify-content: space-between; gap: 8px; align-items: center; }\n  .signal .value { font-size: 20px; font-weight: 600; margin: 8px 0 2px; }\n  .kpi .label { font-size: 12px; color: var(--muted); }\n  .kpi .value { font-size: 19px; font-weight: 600; margin: 4px 0 2px; }\n  .charts { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 14px; }\n  @media (min-width: 1000px) { .charts { grid-template-columns: 1fr 1fr; } .charts .wide { grid-column: span 2; } }\n  svg.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }\n  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; min-height: 18px; }\n  table { width: 100%; border-collapse: collapse; }\n  th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }\n  thead th { color: var(--muted); font-weight: 500; font-size: 12px; }\n  tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }\n  .num { text-align: right; font-variant-numeric: tabular-nums; }\n  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }\n  .cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }\n  .card h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 500; }\n  ul.insights { margin: 0; padding-left: 20px; }\n  ul.insights li { margin-bottom: 6px; }\n  .rules { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }\n  .plan-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); margin-bottom: 12px; }\n  .plan-head .big { font-size: 20px; font-weight: 600; }\n  .tag-buy, .tag-sell { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }\n  .tag-buy { background: var(--accent-bg); color: var(--accent); }\n  .tag-sell { background: var(--warn-bg); color: var(--warn); }\n  footer { margin-top: 18px; color: var(--muted); font-size: 12px; }\n  .scroll { overflow-x: auto; }\n  .lanbox { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--accent-bg); margin-bottom: 14px; }\n  .lanbox img { width: 132px; height: 132px; border-radius: 8px; background: #fff; padding: 4px; }\n  .lanbox .url { font-family: ui-monospace, Consolas, monospace; font-size: 15px; font-weight: 600; }\n  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }\n  .tab { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; font: inherit; }\n  .tab:hover { border-color: var(--accent); color: var(--accent); }\n  .tab.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }\n  pre.code { max-height: 62vh; overflow: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.55; white-space: pre; font-family: ui-monospace, Consolas, \"Cascadia Mono\", monospace; }\n  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }\n  .docs h1 { font-size: 20px; margin: 18px 0 10px; }\n  .docs h2 { font-size: 16px; margin: 18px 0 8px; }\n  .docs h3 { font-size: 14px; margin: 14px 0 6px; }\n  .docs p, .docs li { font-size: 13.5px; }\n  .docs code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }\n  .docs blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel-2); color: var(--muted); border-radius: 0 8px 8px 0; }\n  .docs table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 14px; }\n  .docs th, .docs td { border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; text-align: left; }\n  .docs a { color: var(--accent); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cnav class=\"tabs\" id=\"mainTabs\" aria-label=\"内容切换\">\n    \u003cbutton class=\"tab active\" type=\"button\" data-tab=\"panel\">大盘面板\u003c/button>\n    \u003cbutton class=\"tab\" type=\"button\" data-tab=\"docs\">使用说明\u003c/button>\n    \u003cbutton class=\"tab\" type=\"button\" data-tab=\"data\">数据明细\u003c/button>\n    \u003cbutton class=\"tab\" type=\"button\" data-tab=\"code\">面板源码\u003c/button>\n  \u003c/nav>\n\n  \u003csection id=\"tab-panel\">\n  \u003cheader class=\"top\">\n    \u003cdiv>\n      \u003ch1>CS2 饰品大盘面板\u003c/h1>\n      \u003cp class=\"small muted\" id=\"subtitle\">正在加载数据…\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"actions\">\n      \u003cspan class=\"dot\" id=\"liveDot\" title=\"数据连接状态\">\u003c/span>\n      \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"autoRefresh\" checked> 自动刷新（5 分钟）\u003c/label>\n      \u003cbutton id=\"refreshBtn\" type=\"button\">立即刷新\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"alert\" id=\"alert\" hidden>\u003c/div>\n  \u003csection class=\"verdict\" id=\"verdict\">\u003c/section>\n  \u003csection class=\"grid grid-4\" id=\"signals\">\u003c/section>\n  \u003csection class=\"grid grid-6\" id=\"kpis\">\u003c/section>\n  \u003cdiv id=\"lanBox\" class=\"lanbox\" hidden>\u003c/div>\n\n  \u003csection class=\"charts\">\n    \u003cdiv class=\"card wide\">\n      \u003ch2>大盘指数 · 近 24 小时\u003c/h2>\n      \u003csvg class=\"chart\" id=\"chartIndex\" role=\"img\" aria-label=\"大盘指数近 24 小时走势\">\u003c/svg>\n      \u003cp class=\"hint\" id=\"hintIndex\">把鼠标移到曲线上查看逐小时点位\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch2>全站日成交额 · 近 180 天\u003c/h2>\n      \u003csvg class=\"chart\" id=\"chartTrade\" role=\"img\" aria-label=\"日成交额近 180 天走势\">\u003c/svg>\n      \u003cp class=\"hint\" id=\"hintTrade\">把鼠标移到曲线上查看单日数据\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch2>在线人数 · 近 180 天\u003c/h2>\n      \u003csvg class=\"chart\" id=\"chartOnline\" role=\"img\" aria-label=\"在线人数近 180 天走势\">\u003c/svg>\n      \u003cp class=\"hint\" id=\"hintOnline\">实线＝当日峰值　虚线＝当日均值\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"card\" style=\"margin-bottom:14px\">\n    \u003ch2>结构：品类 · 板块 · 异动\u003c/h2>\n    \u003cdiv class=\"cols\">\n      \u003cdiv>\n        \u003ch3>七大品类（近 24 小时）\u003c/h3>\n        \u003cdiv class=\"scroll\">\u003ctable id=\"tblCats\">\u003c/table>\u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch3>板块指数涨跌榜（较昨收）\u003c/h3>\n        \u003cdiv class=\"scroll\">\u003ctable id=\"tblBlocks\">\u003c/table>\u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch3>最近价格异动\u003c/h3>\n        \u003cdiv class=\"scroll\">\u003ctable id=\"tblChanges\">\u003c/table>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"card\" style=\"margin-bottom:14px\">\n    \u003ch2>买卖点计划 · 条件触发（不预测方向，只定义动作）\u003c/h2>\n    \u003cdiv id=\"planHead\">\u003c/div>\n    \u003cdiv class=\"scroll\">\u003ctable id=\"tblPlans\">\u003c/table>\u003c/div>\n    \u003cdiv class=\"rules\" id=\"planNote\">\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"card\">\n    \u003ch2>结论与盯盘清单\u003c/h2>\n    \u003cul class=\"insights\" id=\"insights\">\u003c/ul>\n    \u003cdiv class=\"rules\" id=\"rules\">\u003c/div>\n  \u003c/section>\n\n  \u003c/section>\n\n  \u003csection id=\"tab-docs\" hidden>\n    \u003cdiv class=\"card docs\" id=\"docsBox\">\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"tab-data\" hidden>\n    \u003cdiv class=\"card\" id=\"dataBox\">\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"tab-code\" hidden>\n    \u003cdiv class=\"card\" id=\"codeBox\">\u003c/div>\n  \u003c/section>\n\n  \u003cfooter id=\"foot\">\u003c/footer>\n\u003c/div>\n\n\u003c!--STATIC-->\n\u003cscript>\n(function () {\n  \"use strict\";\n  var STATIC = window.__STATIC_DATA__ || null;\n  var HOSTED = !!STATIC && /^https?:$/.test(String(location.protocol));\n  var REFRESH_MS = 5 * 60 * 1000;\n  var state = { data: null, timer: null, loading: false };\n  var $ = function (id) { return document.getElementById(id); };\n\n  function fmtInt(v) { return Number(v).toLocaleString(\"zh-CN\", { maximumFractionDigits: 0 }); }\n  function fmtMoney(v) {\n    var a = Math.abs(v);\n    if (a >= 1e8) return (v / 1e8).toFixed(2) + \" 亿\";\n    if (a >= 1e4) return (v / 1e4).toFixed(1) + \" 万\";\n    return fmtInt(v);\n  }\n  function fmtPeople(v) {\n    if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + \" 万\";\n    return fmtInt(v);\n  }\n  function fmtPct(v, d) { if (v === null || v === undefined) return \"—\"; return (v > 0 ? \"+\" : \"\") + Number(v).toFixed(d === undefined ? 2 : d) + \"%\"; }\n  function toneClass(v) { return v > 0 ? \"up\" : (v \u003c 0 ? \"down\" : \"flat\"); }\n  function esc(s) { return String(s === null || s === undefined ? \"\" : s).replace(/[&\u003c>\"]/g, function (c) { return { \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c]; }); }\n\n  function renderVerdict(d) {\n    var v = d.verdict;\n    $(\"verdict\").innerHTML =\n      '\u003cdiv>\u003cdiv class=\"small muted\">当前大盘状态\u003c/div>\u003cdiv class=\"level ' + esc(v.level) + '\">' + esc(v.title) + '\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"small muted\" style=\"flex:1;min-width:240px\">' + esc(v.desc) + '\u003c/div>' +\n      '\u003cdiv class=\"small\">达标信号 \u003cb>' + v.passed + \"/\" + v.total + '\u003c/b>\u003c/div>';\n  }\n\n  function renderSignals(d) {\n    $(\"signals\").innerHTML = d.signals.map(function (s) {\n      return '\u003cdiv class=\"card signal\">' +\n        '\u003cdiv class=\"name\">\u003cspan class=\"small muted\">' + esc(s.name) + '\u003c/span>\u003cspan class=\"pill ' + esc(s.status) + '\">' + esc(s.statusText) + '\u003c/span>\u003c/div>' +\n        '\u003cdiv class=\"value mono\">' + esc(s.value) + '\u003c/div>' +\n        '\u003cdiv class=\"small muted\">目标：' + esc(s.target) + '\u003c/div>' +\n        '\u003cdiv class=\"small muted\" style=\"margin-top:4px\">' + esc(s.note) + '\u003c/div>' +\n      '\u003c/div>';\n    }).join(\"\");\n  }\n\n  function renderKpis(d) {\n    var items = d.kpis;\n    $(\"kpis\").innerHTML = items.map(function (k) {\n      return '\u003cdiv class=\"card kpi\">\u003cdiv class=\"label\">' + esc(k.label) + '\u003c/div>' +\n        '\u003cdiv class=\"value mono ' + (k.tone || \"\") + '\">' + esc(k.value) + '\u003c/div>' +\n        '\u003cdiv class=\"small muted\">' + esc(k.note) + '\u003c/div>\u003c/div>';\n    }).join(\"\");\n  }\n\n  function renderTables(d) {\n    var cats = d.categories;\n    var html = '\u003cthead>\u003ctr>\u003cth>品类\u003c/th>\u003cth class=\"num\">在售价格指数\u003c/th>\u003cth class=\"num\">24h 价格\u003c/th>\u003cth class=\"num\">在售量\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    cats.forEach(function (c) {\n      html += '\u003ctr>\u003cth>' + esc(c.name) + '\u003c/th>\u003ctd class=\"num\">' + fmtInt(c.sell1) + '\u003c/td>' +\n        '\u003ctd class=\"num ' + toneClass(c.sell_pct) + '\">' + fmtPct(c.sell_pct) + '\u003c/td>' +\n        '\u003ctd class=\"num down\">' + fmtPct(c.cnt_pct) + '\u003c/td>\u003c/tr>';\n    });\n    $(\"tblCats\").innerHTML = html + '\u003c/tbody>';\n\n    var blocks = d.blocks.top.concat(d.blocks.bottom);\n    var bh = '\u003cthead>\u003ctr>\u003cth>板块\u003c/th>\u003cth class=\"num\">指数\u003c/th>\u003cth class=\"num\">涨跌幅\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    blocks.forEach(function (b) {\n      bh += '\u003ctr>\u003cth>' + esc(b.name) + '\u003c/th>\u003ctd class=\"num\">' + fmtInt(b.v) + '\u003c/td>' +\n        '\u003ctd class=\"num ' + toneClass(b.rate) + '\">' + fmtPct(b.rate) + '\u003c/td>\u003c/tr>';\n    });\n    $(\"tblBlocks\").innerHTML = bh + '\u003c/tbody>';\n\n    var ch = '\u003cthead>\u003ctr>\u003cth>饰品\u003c/th>\u003cth class=\"num\">现价\u003c/th>\u003cth class=\"num\">涨跌\u003c/th>\u003cth class=\"num\">时间\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    d.changes.forEach(function (c) {\n      ch += '\u003ctr>\u003cth>' + esc(c.name) + '\u003c/th>\u003ctd class=\"num\">￥' + fmtInt(c.now) + '\u003c/td>' +\n        '\u003ctd class=\"num ' + toneClass(c.pct) + '\">' + fmtPct(c.pct, 1) + '\u003c/td>' +\n        '\u003ctd class=\"num muted\">' + esc(c.time) + '\u003c/td>\u003c/tr>';\n    });\n    $(\"tblChanges\").innerHTML = ch + '\u003c/tbody>';\n  }\n\n  function copyText(text, btn) {\n    function done(okText) {\n      var old = btn.textContent;\n      btn.textContent = okText;\n      setTimeout(function () { btn.textContent = old; }, 1400);\n    }\n    function fallback() {\n      try {\n        var ta = document.createElement(\"textarea\");\n        ta.value = text;\n        document.body.appendChild(ta);\n        ta.select();\n        document.execCommand(\"copy\");\n        document.body.removeChild(ta);\n        done(\"已复制\");\n      } catch (e) { done(\"复制失败\"); }\n    }\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(function () { done(\"已复制\"); }, fallback);\n    } else { fallback(); }\n  }\n\n  function download(name, text, mime) {\n    var blob = new Blob([text], { type: (mime || \"text/plain\") + \";charset=utf-8\" });\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement(\"a\");\n    a.href = url; a.download = name;\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    setTimeout(function () { URL.revokeO lib.parse\nimport urllib.request\nimport uuid\nimport webbrowser\nfrom datetime import datetime, timedelta, timezone\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nBASE = \"https://www.steamdt.com\"\nAPI = BASE + \"/api\"\nCST = timezone(timedelta(hours=8))\nUA = (\"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 \"\n      \"(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36\")\nDEVICE_ID = str(uuid.uuid4())\n\nENDPOINTS = [\n    \"/index/statistics/v1/summary\",\n    \"/index/trend/v1/summary\",\n    \"/index/item-block/v1/summary\",\n    \"/index/transaction/trend/v1/all\",\n    \"/index/players/trend/v1/all\",\n    \"/index/item/change/v1/lately\",\n]\n\n\ndef _timestamp():\n    t = str(int(time.time() * 1000))\n    return t + str(sum(int(c) for c in t) % 10)\n\n\ndef api_get(path, params=None, retries=3, timeout=30):\n    \"\"\"调用 /api 下的公开接口，返回 data 字段；失败抛异常。\"\"\"\n    last = None\n    for attempt in range(retries):\n        try:\n            query = dict(params or {})\n            query[\"timestamp\"] = _timestamp()\n            url = API + path + \"?\" + urllib.parse.urlencode(query)\n            req = urllib.request.Request(url, headers={\n                \"User-Agent\": UA, \"Referer\": BASE + \"/\", \"Origin\": BASE,\n                \"Accept\": \"application/json, text/plain, */*\",\n                \"x-device-id\": DEVICE_ID, \"x-device\": \"1\", \"x-app-version\": \"1.0.0\",\n                \"x-currency\": \"CNY\", \"language\": \"zh_CN\",\n            })\n            with urllib.request.urlopen(req, timeout=timeout) as resp:\n                payload = json.loads(resp.read().decode(\"utf-8\"))\n            if payload.get(\"success\"):\n                return payload[\"data\"]\n            last = RuntimeError(payload.get(\"errorMsg\") or \"接口返回失败\")\n        except Exception as exc:\n            last = exc\n        time.sleep(1.2 * (attempt + 1))\n    raise last\n\n\ndef fetch_categories():\n    \"\"\"走势页 SSR 里带七大品类 24 小时明细（该接口的 API 版本有风控，改用页面数据）。\"\"\"\n    req = urllib.request.Request(BASE + \"/trend\", headers={\"User-Agent\": UA})\n    html = urllib.request.urlopen(req, timeout=30).read().decode(\"utf-8\", \"replace\")\n    import re\n    m = re.search(r\"\u003cscript type=\\\"application/json\\\" data-nuxt-data=\\\"nuxt-app\\\"[^>]*>(.*?)\u003c/script>\", html, re.S)\n    if not m:\n        return []\n    flat = json.loads(m.group(1))\n\n    def resolve(i, depth=0):\n        if depth > 300:\n            return None\n        v = flat[i]\n        if isinstance(v, dict):\n            return {k: resolve(x, depth + 1) for k, x in v.items()}\n        if isinstance(v, list):\n            if v and isinstance(v[0], str):\n                return resolve(v[1], depth + 1) if len(v) == 2 else v\n            return [resolve(x, depth + 1) for x in v]\n        return v\n\n    def walk(node):\n        if isinstance(node, dict):\n            data = node.get(\"data\")\n            if isinstance(data, list) and data and isinstance(data[0], dict) and \"typeVal\" in data[0]:\n                return data\n            for value in node.values():\n                found = walk(value)\n                if found:\n                    return found\n        elif isinstance(node, list):\n            if node and isinstance(node[0], dict) and \"typeVal\" in node[0]:\n                return node\n            for item in node:\n                found = walk(item)\n                if found:\n                    return found\n        return None\n\n    return walk(resolve(0)) or []\n\n\ndef collect():\n    stat = api_get(\"/index/statistics/v1/summary\")\n    trend = api_get(\"/index/trend/v1/summary\")\n    blocks = api_get(\"/index/item-block/v1/summary\")\n    txs = api_get(\"/index/transaction/trend/v1/all\")\n    players = api_get(\"/index/players/trend/v1/all\")\n    changes = api_get(\"/index/item/change/v1/lately\")\n    try:\n        categories = fetch_categories()\n    except Exception:\n        categories = []\n    return {\"stat\": stat, \"trend\": trend, \"blocks\": blocks, \"txs\": txs,\n            \"players\": players, \"changes\": changes, \"categories\": categories}\n\n\n# ============================================================================\n#  分析层：指标、信号与结论\n# ============================================================================\ndef _mean(rows, i0, i1, idx):\n    return statistics.mean(r[idx] for r in rows[i0:i1])\n\n\ndef analyze(raw):\n    stat, trend = raw[\"stat\"], raw[\"trend\"]\n    blocks, txs, players, changes = raw[\"blocks\"], raw[\"txs\"], raw[\"players\"], raw[\"changes\"]\n\n    series = [{\"t\": int(t), \"v\": round(float(v), 2),\n               \"label\": datetime.fromtimestamp(int(t), CST).strftime(\"%m-%d %H:00\")}\n              for t, v in stat[\"historyMarketIndexList\"]]\n    index_now = float(stat[\"broadMarketIndex\"])\n    first, last = series[0][\"v\"], series[-1][\"v\"]\n    chg24 = round((last / first - 1) * 100, 2)\n\n    sent = stat[\"transPerformanceTrend\"]\n    online = trend[\"onlinePlayerTrend\"]\n\n    rows = [(d, float(a), int(c)) for d, a, c in txs]\n    partial = rows[-1]                      # 今天（未走完）\n    done = rows[:-1]                        # 最近一个完整交易日收尾\n    if len(done) \u003c 400:\n        raise RuntimeError(\"成交序列过短，无法计算同比\")\n    last_day = done[-1]\n    avg30 = _mean(done, len(done) - 30, len(done), 1)\n    avg7 = _mean(done, len(done) - 7, len(done), 1)\n    yoy30 = _mean(done, len(done) - 395, len(done) - 365, 1)\n    yoy7 = _mean(done, len(done) - 372, len(done) - 365, 1)\n    ratio30 = last_day[1] / avg30\n\n    ppl = [(d, int(a), int(b)) for d, a, b in players if d != partial[0]]\n    online_avg30 = _mean(ppl, len(ppl) - 30, len(ppl), 1)\n    online_yoy = _mean(ppl, len(ppl) - 395, len(ppl) - 365, 1)\n    online_yoy_pct = round((online_avg30 / online_yoy - 1) * 100, 2)\n\n    cats = []\n    for c in raw[\"categories\"]:\n        cats.append({\n            \"name\": c[\"nameZh\"],\n            \"sell1\": c[\"endSellPrice\"],\n            \"sell_pct\": round((c[\"endSellPrice\"] / c[\"startSellPrice\"] - 1) * 100, 2) if c[\"startSellPrice\"] else None,\n            \"cnt_pct\": round((c[\"endSellCount\"] / c[\"startSellCount\"] - 1) * 100, 2) if c[\"startSellCount\"] else None,\n        })\n    supply_avg = round(statistics.mean(c[\"cnt_pct\"] for c in cats), 2) if cats else None\n    down_count = sum(1 for c in cats if (c[\"sell_pct\"] or 0) \u003c 0)\n\n    # ---- 四个盯盘信号 ----\n    signals = []\n    if ratio30 >= 1.0:\n        s1_status, s1_text = \"good\", \"达标\"\n    elif ratio30 >= 0.85:\n        s1_status, s1_text = \"warn\", \"接近\"\n    else:\n        s1_status, s1_text = \"bad\", \"未达标\"\n    signals.append({\n        \"key\": \"volume\", \"name\": \"① 量能修复\", \"status\": s1_status, \"statusText\": s1_text,\n        \"value\": \"%.0f%%\" % (ratio30 * 100),\n        \"target\": \"≥ 100%%（30 日均值 %s 万）\" % format(avg30 / 1e4, \",.0f\"),\n        \"note\": \"最近完整交易日成交额 %s 万，较去年同期 30 日均值 %+.1f%%\" % (format(last_day[1] / 1e4, \",.0f\"),\n                                                              (last_day[1] / yoy30 - 1) * 100),\n    })\n    if supply_avg is None:\n        s2_status, s2_text, s2_value = \"neutral\", \"无数据\", \"—\"\n    else:\n        if supply_avg \u003c= 0:\n            s2_status, s2_text = \"good\", \"已回落\"\n        elif supply_avg \u003c= 0.5:\n            s2_status, s2_text = \"warn\", \"接近拐点\"\n        else:\n            s2_status, s2_text = \"bad\", \"仍在增加\"\n        s2_value = \"%+.2f%%\" % supply_avg\n    signals.append({\n        \"key\": \"supply\", \"name\": \"② 供给拐点\", \"status\": s2_status, \"statusText\": s2_text,\n        \"value\": s2_value,\n        \"target\": \"七大品类在售量 24h 变化均值 ≤ 0%\",\n        \"note\": (\"%d/%d 个品类在售量上升，供给端仍在加压\" % (len(cats) - sum(1 for c in cats if c[\"cnt_pct\"] \u003c= 0), len(cats))\n                 if cats else \"无品类数据\"),\n    })\n    if index_now >= 810:\n        s3_status, s3_text = \"good\", \"已收复\"\n    elif index_now >= 807:\n        s3_status, s3_text = \"warn\", \"区间内\"\n    else:\n        s3_status, s3_text = \"bad\", \"仍在下方\"\n    signals.append({\n        \"key\": \"price\", \"name\": \"③ 价格收复\", \"status\": s3_status, \"statusText\": s3_text,\n        \"value\": \"%.2f 点\" % index_now,\n        \"target\": \"站上 807～810 密集区\",\n        \"note\": \"近 24 小时 %+.2f%%，基期以来 %+.2f%%\" % (chg24, (last / 1000 - 1) * 100),\n    })\n    yh, lw = online[\"yesterdayHourRatio\"], online[\"lastWeekHourRatio\"]\n    if yh > 0 and lw > 0:\n        s4_status, s4_text = \"good\", \"双升\"\n    elif yh > 0 or lw > 0:\n        s4_status, s4_text = \"warn\", \"单升\"\n    else:\n        s4_status, s4_text = \"bad\", \"双降\"\n    signals.append({\n        \"key\": \"people\", \"name\": \"④ 人气验证\", \"status\": s4_status, \"statusText\": s4_text,\n        \"value\": \"%s / %s\" % (pct_short(yh), pct_short(lw)),\n        \"target\": \"较昨日同时段、上周同时段同时为正\",\n        \"note\": \"当前在线 %s 人，近 30 日均值同比 %+.1f%%\" % (format(online[\"count\"], \",\"), online_yoy_pct),\n    })\n\n    passed = sum(1 for s in signals if s[\"status\"] == \"good\")\n    warns = sum(1 for s in signals if s[\"status\"] == \"warn\")\n    if passed >= 3:\n        level, title = \"good\", \"转强信号出现\"\n    elif passed == 2:\n        level, title = \"warn\", \"修复中出现分化\"\n    else:\n        level, title = \"bad\", \"弱势延续\"\n    bad_names = \"、\".join(s[\"name\"] for s in signals if s[\"status\"] == \"bad\")\n    good_names = \"、\".join(s[\"name\"] for s in signals if s[\"status\"] == \"good\")\n    desc = \"4 个信号中 %d 个达标、%d 个接近。\" % (passed, warns)\n    if good_names:\n        desc += \"达标：\" + good_names + \"。\"\n    if bad_names:\n        desc += \"未达标：\" + bad_names + \"。\"\n\n    # ---- 买卖点计划（条件触发，非预测） ----\n    low24 = min(x[\"v\"] for x in series)\n    high24 = max(x[\"v\"] for x in series)\n    span = round(high24 - low24, 2)\n    zone_low, zone_high = 807.0, 810.0\n    stop_loss = float(round((low24 - 4) / 5.0) * 5)\n    target1 = round(zone_high + span, 1)\n    target2 = round(zone_high + span * 2, 1)\n    full_day_ok = ratio30 >= 1.0\n    supply_ok = (supply_avg is not None and supply_avg \u003c= 0)\n    supply_worse = (supply_avg is not None and supply_avg > 1.5)\n    volume_dry = ratio30 \u003c 0.8\n    people_ok = yh > 0 and lw > 0\n\n    plans = [\n        {\"side\": \"buy\", \"name\": \"试仓买入\", \"size\": \"建仓 30%\",\n         \"trigger\": \"指数 ≥ %.1f 且最近完整日成交额 ≥ 30 日均值（%.0f 万）\" % (zone_low, avg30 / 1e4),\n         \"active\": index_now >= zone_low and full_day_ok,\n         \"now\": \"指数 %.2f 点、量能 %.0f%%\" % (index_now, ratio30 * 100)},\n        {\"side\": \"buy\", \"name\": \"加仓确认\", \"size\": \"加至 60%\",\n         \"trigger\": \"指数 ≥ %.1f 且七大品类在售量 24h 变化均值 ≤ 0%%\" % zone_high,\n         \"active\": index_now >= zone_high and supply_ok,\n         \"now\": \"在售量均值 %s\" % ((\"%+.2f%%\" % supply_avg) if supply_avg is not None else \"—\")},\n        {\"side\": \"buy\", \"name\": \"趋势加满\", \"size\": \"加至 100%\",\n         \"trigger\": \"指数连续 3 日站上 %.0f 且在线人数昨日/上周同时段双升\" % zone_high,\n         \"active\": False,\n         \"now\": \"需要连续 3 日数据，当前%s\" % (\"双升\" if people_ok else \"未确认\")},\n        {\"side\": \"sell\", \"name\": \"减仓一半\", \"size\": \"仓位减半\",\n         \"trigger\": \"指数跌破近 24 小时低点 %.1f\" % low24,\n         \"active\": index_now \u003c low24,\n         \"now\": \"现价 %.2f，低于低点即减；目前距低点 %+.2f%%\" % (index_now, (index_now / low24 - 1) * 100)},\n        {\"side\": \"sell\", \"name\": \"止损离场\", \"size\": \"清仓止损\",\n         \"trigger\": \"指数跌破 %.0f（低点下方约 %.1f%%）\" % (stop_loss, (stop_loss / low24 - 1) * 100),\n         \"active\": index_now \u003c stop_loss,\n         \"now\": \"止损线 %.0f，距现价 %+.2f%%\" % (stop_loss, (stop_loss / index_now - 1) * 100)},\n        {\"side\": \"sell\", \"name\": \"供给恶化减仓\", \"size\": \"减至 20%\",\n         \"trigger\": \"在售量 24h 均值 > +1.5% 且成交额 \u003c 30 日均值的 80%\",\n         \"active\": supply_worse and volume_dry,\n         \"now\": \"在售量 %s、量能 %.0f%%\" % (((\"%+.2f%%\" % supply_avg) if supply_avg is not None else \"—\"), ratio30 * 100)},\n        {\"side\": \"sell\", \"name\": \"分批止盈\", \"size\": \"每档减 1/3\",\n         \"trigger\": \"指数站稳 %.0f 后涨 3%%（≈ %.0f）或在售量 24h 均值 > +3%%\" % (zone_high, zone_high * 1.03),\n         \"active\": index_now >= zone_high * 1.03 or (supply_avg is not None and supply_avg > 3),\n         \"now\": \"现价 %.2f，第一目标 %.1f / 第二目标 %.1f\" % (index_now, target1, target2)},\n    ]\n\n    if passed >= 4:\n        pos = (60, \"60%～100%\", \"四个信号全部达标，可按计划分批建仓。\")\n    elif passed == 3:\n        pos = (60, \"约 60%\", \"多数信号达标，可加仓但保留 40% 现金应对反复。\")\n    elif passed == 2:\n        pos = (30, \"约 30%\", \"信号刚过半，只做试仓，破位即减。\")\n    elif passed == 1:\n        pos = (10, \"0%～10%\", \"只有单一信号达标，以观察为主，不建议重仓。\")\n    else:\n        pos = (0, \"0%～10%（观望）\", \"四个信号均未达标，等待量能与价格同时改善再进场。\")\n    position = {\"pct\": pos[0], \"range\": pos[1], \"text\": pos[2],\n                \"levels\": {\"support\": low24, \"resistance\": high24, \"span\": span,\n                           \"zone_low\": zone_low, \"zone_high\": zone_high,\n                           \"stop\": stop_loss, \"target1\": target1, \"target2\": target2}}\n\n    # ---- 要点 ----\n    insights = [\n        \"大盘指数 %.2f 点，近 24 小时 %+.2f%%（%.2f → %.2f），距 2023-06-20 基期 %+.2f%%，当前%s %d 日。\"\n        % (index_now, chg24, first, last, (last / 1000 - 1) * 100,\n           \"连跌\" if stat[\"riseFallType\"] == \"DOWN\" else \"连涨\", stat[\"riseFallDays\"]),\n        \"最近完整交易日（%s）全站成交额 %s 万、%s 笔，单笔约 ￥%.1f；为近 30 日均值的 %.0f%%。\"\n        % (last_day[0], format(last_day[1] / 1e4, \",.0f\"), format(last_day[2], \",\"),\n           last_day[1] / last_day[2], ratio30 * 100),\n        \"近 30 日日均成交额 %s 万，同比 %+.1f%%；近 7 日日均 %s 万，同比 %+.1f%%，量能是当前主要瓶颈。\"\n        % (format(avg30 / 1e4, \",.0f\"), (avg30 / yoy30 - 1) * 100,\n           format(avg7 / 1e4, \",.0f\"), (avg7 / yoy7 - 1) * 100),\n        \"市场情绪分 %d/100（较昨日 %+d），处于%s区间。\"\n        % (sent[\"performanceScore\"], sent[\"diffYesterdayScore\"],\n           \"偏冷\" if sent[\"performanceScore\"] \u003c 45 else (\"中性\" if sent[\"performanceScore\"] \u003c 65 else \"偏热\")),\n        \"当前在线 %s 人，较昨日同时段 %+.1f%%、上周同时段 %+.1f%%；近 30 日均值同比 %+.1f%%。\"\n        % (format(online[\"count\"], \",\"), yh, lw, online_yoy_pct),\n    ]\n    if cats:\n        insights.append(\"七大品类近 24 小时 %d/%d 下跌，价格平均 %+.2f%%，在售量平均 %+.2f%%（供给%s）。\"\n                        % (down_count, len(cats), statistics.mean(c[\"sell_pct\"] for c in cats), supply_avg,\n                           \"仍在扩张\" if supply_avg > 0.5 else (\"接近拐点\" if supply_avg > 0 else \"开始回落\")))\n    hot = blocks[\"hot\"][\"topList\"][0] if blocks.get(\"hot\", {}).get(\"topList\") else None\n    weak = blocks[\"hot\"][\"bottomList\"][0] if blocks.get(\"hot\", {}).get(\"bottomList\") else None\n    if hot and weak:\n        insights.append(\"板块层面：%s %+.2f%% 领涨、%s %+.2f%% 领跌，资金只在个别题材里轮动。\"\n                        % (hot[\"name\"], hot[\"riseFallRate\"], weak[\"name\"], weak[\"riseFallRate\"]))\n\n    kpis = [\n        {\"label\": \"大盘指数\", \"value\": \"%.2f 点\" % index_now, \"note\": \"基期以来 %+.2f%%\" % ((last / 1000 - 1) * 100),\n         \"tone\": tone_of(chg24)},\n        {\"label\": \"近 24 小时\", \"value\": \"%+.2f%%\" % chg24, \"note\": \"%.2f → %.2f 点\" % (first, last), \"tone\": tone_of(chg24)},\n        {\"label\": \"市场情绪分\", \"value\": \"%d / 100\" % sent[\"performanceScore\"],\n         \"note\": \"较昨日 %+d 分\" % sent[\"diffYesterdayScore\"], \"tone\": tone_of(sent[\"diffYesterdayScore\"])},\n        {\"label\": \"当前在线\", \"value\": format(online[\"count\"], \",\") + \" 人\",\n         \"note\": \"昨日同时段 %+.1f%%\" % yh, \"tone\": tone_of(yh)},\n        {\"label\": \"建议仓位\", \"value\": position[\"range\"], \"note\": \"信号达标 %d/4\" % passed,\n         \"tone\": \"good\" if passed >= 3 else (\"flat\" if passed == 2 else \"down\")},\n        {\"label\": \"关键价位\", \"value\": \"%.1f / %.1f\" % (low24, high24),\n         \"note\": \"近 24h 支撑 / 压力（止损 %.0f）\" % stop_loss, \"tone\": \"flat\"},\n        {\"label\": \"最近完整日成交额\", \"value\": format(last_day[1] / 1e4, \",.0f\") + \" 万\",\n         \"note\": \"为 30 日均值 %.0f%%\" % (ratio30 * 100), \"tone\": tone_of(ratio30 - 1)},\n        {\"label\": \"饰品存世量\", \"value\": \"%.2f 亿件\" % (int(stat[\"surviveNum\"]) / 1e8),\n         \"note\": \"持有者 %s 人\" % format(int(stat[\"holdersNum\"]), \",\"), \"tone\": \"flat\"},\n    ]\n\n    cat_rows = [{\"name\": c[\"name\"], \"sell1\": c[\"sell1\"], \"sell_pct\": c[\"sell_pct\"], \"cnt_pct\": c[\"cnt_pct\"]} for c in cats]\n    block_rows = {\n        \"top\": [{\"name\": x[\"name\"], \"v\": x[\"index\"], \"rate\": x[\"riseFallRate\"]} for x in blocks[\"hot\"][\"topList\"]],\n        \"bottom\": [{\"name\": x[\"name\"], \"v\": x[\"index\"], \"rate\": x[\"riseFallRate\"]} for x in blocks[\"hot\"][\"bottomList\"]],\n    }\n    change_rows = []\n    for x in changes[\"list\"][:8]:\n        before, now = x[\"beforeSellPrice\"], x[\"sellPrice\"]\n        change_rows.append({\n            \"name\": x[\"name\"], \"now\": now,\n            \"pct\": round((now / before - 1) * 100, 1) if before else None,\n            \"time\": datetime.fromtimestamp(int(x[\"changeTime\"]), CST).strftime(\"%m-%d %H:%M\"),\n        })\n\n    payload = {\n        \"ok\": True,\n        \"generated_at\": datetime.now(CST).strftime(\"%Y-%m-%d %H:%M:%S\"),\n        \"data_time\": datetime.fromtimestamp(int(stat[\"updateTime\"]), CST).strftime(\"%Y-%m-%d %H:%M:%S\"),\n        \"stale\": False,\n        \"notice\": \"\",\n        \"index\": {\"current\": index_now, \"series\": series},\n        \"kpis\": kpis,\n        \"signals\": signals,\n        \"verdict\": {\"level\": level, \"title\": title, \"desc\": desc, \"passed\": passed, \"total\": len(signals)},\n        \"insights\": insights,\n        \"rules\": RULES,\n        \"plans\": plans,\n        \"position\": position,\n        \"categories\": cat_rows,\n        \"blocks\": block_rows,\n        \"changes\": change_rows,\n        \"trade\": {\"series\": [{\"t\": _ms(d), \"d\": d, \"a\": a, \"c\": c} for d, a, c in done[-180:]]},\n        \"online\": {\"series\": [{\"t\": _ms(d), \"d\": d, \"avg\": a, \"peak\": b} for d, a, b in ppl[-180:]]},\n        \"footnote\": (\"数据来自 steamdt.com 公开接口；指数以 2023-06-20 = 1000 为基期、每 5 分钟计算一次，\"\n                     \"涨跌幅为平台展示口径，仅供研究参考，不构成投资建议。\"),\n    }\n    return payload\n\n\ndef pct_short(v):\n    \"\"\"极小涨跌幅保留两位小数，避免显示成 -0.0%。\"\"\"\n    return (\"%+.2f%%\" % v) if abs(v) \u003c 0.1 else (\"%+.1f%%\" % v)\n\n\ndef _ms(date_str):\n    return int(datetime.strptime(date_str, \"%Y-%m-%d\").replace(tzinfo=CST).timestamp() * 1000)\n\n\ndef tone_of(v):\n    if v > 0:\n        return \"up\"\n    if v \u003c 0:\n        return \"down\"\n    return \"flat\"\n\n\nRULES = (\n    \"\u003cb>盯盘清单（当 4 条同时成立时，才更可能是趋势反转而非反弹）\u003c/b>\"\n    \"\u003cbr>① 成交额回到近 30 日均值之上，并且连续 3 天以上；\"\n    \"\u003cbr>② 七大品类在售量止涨回落（供给收缩先于价格见底）；\"\n    \"\u003cbr>③ 大盘指数收复并站稳 807～810；\"\n    \"\u003cbr>④ 在线人数在昨日同时段与上周同时段同时为正。\"\n    \"\u003cbr>反向信号：在售量继续增加 + 成交额不放大，弱势通常延续。\"\n)\n\n\n# ============================================================================\n#  服务层：本地 HTTP 服务 + 静态导出\n# ============================================================================\nCACHE = {\"ts\": 0.0, \"payload\": None}\nCACHE_LOCK = threading.Lock()\n\n\ndef error_payload(message):\n    return {\n        \"ok\": False,\n        \"generated_at\": datetime.now(CST).strftime(\"%Y-%m-%d %H:%M:%S\"),\n        \"data_time\": \"—\", \"stale\": True, \"notice\": message,\n        \"index\": {\"current\": 0, \"series\": []},\n        \"kpis\": [], \"signals\": [],\n        \"verdict\": {\"level\": \"bad\", \"title\": \"数据暂不可用\", \"desc\": message, \"passed\": 0, \"total\": 4},\n        \"insights\": [], \"rules\": RULES,\n        \"categories\": [], \"blocks\": {\"top\": [], \"bottom\": []}, \"changes\": [],\n        \"trade\": {\"series\": []}, \"online\": {\"series\": []}, \"footnote\": \"\",\n    }\n\n\ndef get_payload(ttl=300, force=False):\n    with CACHE_LOCK:\n        fresh = CACHE[\"payload\"] is not None and (time.time() - CACHE[\"ts\"]) \u003c ttl\n        if fresh and not force:\n            return CACHE[\"payload\"]\n    try:\n        payload = analyze(collect())\n    except Exception as exc:\n        with CACHE_LOCK:\n            cached = CACHE[\"payload\"]\n        if cached is not None:\n            payload = dict(cached)\n            payload[\"stale\"] = True\n            payload[\"notice\"] = \"上游数据暂时不可用（%s），当前显示 %s 抓取的缓存数据。\" % (exc, cached[\"generated_at\"])\n            return payload\n        return error_payload(\"无法从 steamdt.com 获取数据：%s。请检查网络后点“立即刷新”。\" % exc)\n    payload[\"ttl\"] = ttl\n    with CACHE_LOCK:\n        CACHE[\"payload\"] = payload\n        CACHE[\"ts\"] = time.time()\n    return payload\n\n\ndef _read_text(path):\n    try:\n        with open(path, \"r\", encoding=\"utf-8\") as fh:\n            return fh.read()\n    except Exception:\n        return \"\"\n\n\ndef md_to_html(text):\n    \"\"\"极简 Markdown → HTML（标题/列表/表格/引用/加粗/行内代码/链接），够 README 用。\"\"\"\n    def inline(t):\n        t = t.replace(\"&\", \"&amp;\").replace(\"\u003c\", \"&lt;\").replace(\">\", \"&gt;\")\n        t = re.sub(r\"\\*\\*(.+?)\\*\\*\", r\"\u003cb>\\1\u003c/b>\", t)\n        t = re.sub(r\"`([^`]+)`\", r\"\u003ccode>\\1\u003c/code>\", t)\n        t = re.sub(r\"\\[([^\\]]+)\\]\\(([^)]+)\\)\", r'\u003ca href=\"\\2\" target=\"_blank\" rel=\"noopener\">\\1\u003c/a>', t)\n        return t\n\n    lines = text.splitlines()\n    out, list_kind, i = [], None, 0\n    while i \u003c len(lines):\n        line = lines[i].strip()\n        if not line:\n            if list_kind:\n                out.append(\"\u003c/%s>\" % list_kind)\n                list_kind = None\n            i += 1\n            continue\n        if line.startswith(\"|\") and i + 1 \u003c len(lines) and re.match(r\"^\\|[\\s:\\-|]+\\|$\", lines[i + 1].strip()):\n            if list_kind:\n                out.append(\"\u003c/%s>\" % list_kind)\n                list_kind = None\n            head = [c.strip() for c in line.strip(\"|\").split(\"|\")]\n            i += 2\n            body = []\n            while i \u003c len(lines) and lines[i].strip().startswith(\"|\"):\n                body.append([c.strip() for c in lines[i].strip().strip(\"|\").split(\"|\")])\n                i += 1\n            out.append(\"\u003ctable>\u003cthead>\u003ctr>\" + \"\".join(\"\u003cth>%s\u003c/th>\" % inline(c) for c in head) +\n                       \"\u003c/tr>\u003c/thead>\u003ctbody>\" +\n                       \"\".join(\"\u003ctr>\" + \"\".join(\"\u003ctd>%s\u003c/td>\" % inline(c) for c in row) + \"\u003c/tr>\" for row in body) +\n                       \"\u003c/tbody>\u003c/table>\")\n            continue\n        m = re.match(r\"^(#{1,3})\\s+(.*)$\", line)\n        if m:\n            if list_kind:\n                out.append(\"\u003c/%s>\" % list_kind)\n                list_kind = None\n            lvl = len(m.group(1))\n            out.append(\"\u003ch%d>%s\u003c/h%d>\" % (lvl, inline(m.group(2)), lvl))\n            i += 1\n            continue\n        if line.startswith(\">\"):\n            if list_kind:\n                out.append(\"\u003c/%s>\" % list_kind)\n                list_kind = None\n            out.append(\"\u003cblockquote>%s\u003c/blockquote>\" % inline(line.lstrip(\"> \").strip()))\n            i += 1\n            continue\n        m = re.match(r\"^[-*]\\s+(.*)$\", line)\n        if m:\n            if list_kind != \"ul\":\n                if list_kind:\n                    out.append(\"\u003c/%s>\" % list_kind)\n                out.append(\"\u003cul>\")\n                list_kind = \"ul\"\n            out.append(\"\u003cli>%s\u003c/li>\" % inline(m.group(1)))\n            i += 1\n            continue\n        m = re.match(r\"^\\d+\\.\\s+(.*)$\", line)\n        if m:\n            if list_kind != \"ol\":\n                if list_kind:\n                    out.append(\"\u003c/%s>\" % list_kind)\n                out.append(\"\u003col>\")\n                list_kind = \"ol\"\n            out.append(\"\u003cli>%s\u003c/li>\" % inline(m.group(1)))\n            i += 1\n            continue\n        if list_kind:\n            out.append(\"\u003c/%s>\" % list_kind)\n            list_kind = None\n        out.append(\"\u003cp>%s\u003c/p>\" % inline(line))\n        i += 1\n    if list_kind:\n        out.append(\"\u003c/%s>\" % list_kind)\n    return \"\".join(out)\n\n\nDOCS_CACHE = {}\n\n\ndef build_docs():\n    here = os.path.dirname(os.path.abspath(__file__))\n    readme_path = os.path.join(here, \"README.md\")\n    source_path = os.path.join(here, \"steamdt_dashboard.py\")\n    stamp = None\n    try:\n        stamp = (os.path.getmtime(readme_path), os.path.getmtime(source_path))\n    except Exception:\n        pass\n    if DOCS_CACHE.get(\"stamp\") == stamp and DOCS_CACHE.get(\"data\"):\n        return DOCS_CACHE[\"data\"]\n    readme = _read_text(readme_path)\n    source = _read_text(source_path)\n    docs = {\"docs\": md_to_html(readme) if readme else \"\", \"source\": source}\n    DOCS_CACHE[\"stamp\"] = stamp\n    DOCS_CACHE[\"data\"] = docs\n    return docs\n\n\ndef render_page(payload=None, lan_url=None):\n    \"\"\"把页面、文档与源码合成一份可离线打开的 HTML。\"\"\"\n    page = PAGE\n    scripts = []\n    if lan_url:\n        scripts.append(\"\u003cscript>window.__LAN_URL__ = %s;\u003c/script>\" % json.dumps(lan_url))\n    docs = build_docs()\n    docs_blob = json.dumps(docs, ensure_ascii=False).replace(\"\u003c\", \"\\\\u003c\")\n    scripts.append(\"\u003cscript>window.__DOCS__ = \" + docs_blob + \";\u003c/script>\")\n    if payload is not None:\n        blob = json.dumps(payload, ensure_ascii=False, separators=(\",\", \":\")).replace(\"\u003c\", \"\\\\u003c\")\n        scripts.append(\"\u003cscript>window.__STATIC_DATA__ = \" + blob + \";\u003c/script>\")\n    return page.replace(\"\u003c!--STATIC-->\", \"\".join(scripts))\n\n\ndef render_static(payload):\n    return render_page(payload)\n\n\nclass Handler(BaseHTTPRequestHandler):\n    server_version = \"SteamDTDashboard/1.0\"\n    protocol_version = \"HTTP/1.1\"\n\n    def _send(self, code, body, ctype):\n        data = body.encode(\"utf-8\") if isinstance(body, str) else body\n        self.send_response(code)\n        self.send_header(\"Content-Type\", ctype)\n        self.send_header(\"Content-Length\", str(len(data)))\n        self.send_header(\"Cache-Control\", \"no-store\")\n        self.end_headers()\n        try:\n            self.wfile.write(data)\n        except (BrokenPipeError, ConnectionResetError):\n            pass\n\n    def do_GET(self):\n        parsed = urllib.parse.urlparse(self.path)\n        path = parsed.path.rstrip(\"/\") or \"/\"\n        if path in (\"/\", \"/index.html\"):\n            self._send(200, render_page(None, lan_url=getattr(self.server, \"lan_url\", None)),\n                       \"text/html; charset=utf-8\")\n        elif path == \"/api/snapshot\":\n            force = \"refresh\" in urllib.parse.parse_qs(parsed.query)\n            payload = get_payload(ttl=self.server.ttl, force=force)\n            self._send(200, json.dumps(payload, ensure_ascii=False), \"application/json; charset=utf-8\")\n        elif path == \"/api/health\":\n            self._send(200, json.dumps({\"ok\": True}), \"application/json; charset=utf-8\")\n        else:\n            self._send(404, \"404 Not Found\", \"text/plain; charset=utf-8\")\n\n    def log_message(self, fmt, *args):\n        if os.environ.get(\"STEAMDT_VERBOSE\"):\n            sys.stderr.write(\"[面板] %s\\n\" % (fmt % args))\n\n\ndef lan_ips():\n    \"\"\"列出本机可被手机访问的局域网 IPv4 地址。\"\"\"\n    found = set()\n    try:\n        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n        sock.connect((\"8.8.8.8\", 80))\n        found.add(sock.getsockname()[0])\n        sock.close()\n    except Exception:\n        pass\n    try:\n        for info in socket.getaddrinfo(socket.gethostname(), None, socket.AF_INET):\n            found.add(info[4][0])\n    except Exception:\n        pass\n    return sorted(ip for ip in found if ip and not ip.startswith(\"127.\") and ip != \"0.0.0.0\")\n\n\ndef pick_port(host, port, tries=12):\n    for offset in range(tries):\n        candidate = port + offset\n        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:\n            sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n            try:\n                sock.bind((host, candidate))\n                return candidate\n            except OSError:\n                continue\n    raise SystemExit(\"端口 %d 起连续 %d 个端口都被占用，请用 --port 指定其他端口。\" % (port, tries))\n\n\ndef publish(html_path):\n    \"\"\"把快照复制到桌面与 OneDrive，手机上就能直接看到（OneDrive 会自动同步）。\"\"\"\n    home = os.path.expanduser(\"~\")\n    targets = [\n        os.path.join(home, \"Desktop\", \"CS2大盘面板（看这个）.html\"),\n        os.path.join(home, \"OneDrive\", \"CS2大盘面板.html\"),\n    ]\n    for dst in targets:\n        folder = os.path.dirname(dst)\n        if not os.path.isdir(folder):\n            print(\"跳过（目录不存在）：%s\" % folder)\n            continue\n        try:\n            with open(html_path, \"rb\") as fh:\n                data = fh.read()\n            with open(dst, \"wb\") as fh:\n                fh.write(data)\n            print(\"已复制到：%s\" % dst)\n        except Exception as exc:\n            print(\"复制失败（%s）：%s\" % (dst, exc))\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=\"CS2 饰品大盘面板（SteamDT 数据）\")\n    ap.add_argument(\"--port\", type=int, default=8787, help=\"本地端口，默认 8787\")\n    ap.add_argument(\"--host\", default=\"127.0.0.1\",\n                    help=\"监听地址，默认仅本机；填 0.0.0.0 可让同一 Wi-Fi 下的手机访问\")\n    ap.add_argument(\"--ttl\", type=int, default=300, help=\"数据缓存秒数，默认 300\")\n    ap.add_argument(\"--no-open\", action=\"store_true\", help=\"启动后不自动打开浏览器\")\n    ap.add_argument(\"--export\", nargs=\"?\", const=\"steamdt_dashboard.html\", default=None,\n                    help=\"导出可离线打开的静态快照 HTML，然后退出\")\n    ap.add_argument(\"--json\", dest=\"json_path\", default=None, help=\"同时把原始数据写成 JSON 文件\")\n    ap.add_argument(\"--force\", action=\"store_true\", help=\"抓取失败时仍强制写出快照\")\n    ap.add_argument(\"--publish\", action=\"store_true\",\n                    help=\"导出后顺便复制到桌面和 OneDrive，方便手机查看\")\n    ap.add_argument(\"--rebuild\", action=\"store_true\",\n                    help=\"不联网：用已有的 dashboard_payload.json 重新生成 HTML（适合只改了说明/源码后刷新页面）\")\n    args = ap.parse_args()\n\n    here = os.path.dirname(os.path.abspath(__file__))\n\n    if args.rebuild:\n        src = args.json_path or os.path.join(here, \"dashboard_payload.json\")\n        if not os.path.exists(src):\n            raise SystemExit(\"找不到 %s，无法本地重建。请先联网导出一次快照。\" % src)\n        with open(src, \"r\", encoding=\"utf-8\") as fh:\n            payload = json.load(fh)\n        out = args.export if args.export else os.path.join(here, \"steamdt_dashboard.html\")\n        if not os.path.isabs(out):\n            out = os.path.join(here, out)\n        with open(out, \"w\", encoding=\"utf-8\") as fh:\n            fh.write(render_static(payload))\n        print(\"已用 %s（数据时间 %s）重新生成：%s\" % (os.path.basename(src), payload.get(\"data_time\"), out))\n        if args.publish:\n            publish(out)\n        return\n\n    if args.export:\n        print(\"正在抓取数据并导出静态快照 ...\")\n        payload = get_payload(ttl=0, force=True)\n        if payload.get(\"ok\") is False:\n            print(\"抓取失败，未覆盖原有快照：%s\" % payload.get(\"notice\", \"\"))\n            print(\"（可稍后重试，或加 --force 强制写出当前内容）\")\n            if not getattr(args, \"force\", False):\n                raise SystemExit(1)\n        out = args.export if os.path.isabs(args.export) else os.path.join(here, args.export)\n        with open(out, \"w\", encoding=\"utf-8\") as fh:\n            fh.write(render_static(payload))\n        print(\"已导出：%s\" % out)\n        if args.publish:\n            publish(out)\n        if args.json_path:\n            with open(args.json_path, \"w\", encoding=\"utf-8\") as fh:\n                json.dump(payload, fh, ensure_ascii=False, indent=1)\n            print(\"已写出：%s\" % args.json_path)\n        return\n\n    port = pick_port(args.host, args.port)\n    httpd = ThreadingHTTPServer((args.host, port), Handler)\n    httpd.daemon_threads = True\n    httpd.ttl = args.ttl\n    all_iface = args.host in (\"0.0.0.0\", \"::\")\n    url = \"http://%s:%d/\" % (\"127.0.0.1\" if all_iface else args.host, port)\n    print(\"=\" * 58)\n    print(\" CS2 饰品大盘面板已启动\")\n    print(\" 本机访问：%s\" % url)\n    if all_iface:\n        ips = lan_ips()\n        if ips:\n            print(\" 手机访问（手机与本机连同一个 Wi-Fi，浏览器输入下面任一地址）：\")\n            for ip in ips:\n                print(\"    http://%s:%d/\" % (ip, port))\n            print(\" 若手机打不开：Windows 防火墙首次会弹窗，请选择“允许访问”；\")\n            print(\" 并确认手机没有连到访客网络/移动数据。\")\n        else:\n            print(\" 手机访问：未检测到局域网 IP，请检查网络连接。\")\n    lan_url = None\n    if all_iface and lan_ips():\n        lan_url = \"http://%s:%d/\" % (lan_ips()[0], port)\n        qr = \"https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=\" + urllib.parse.quote(lan_url, safe=\"\")\n        print(\" 手机扫码（在电脑浏览器打开下面链接，用手机扫屏幕上的二维码）：\")\n        print(\"    %s\" % qr)\n    httpd.lan_url = lan_url\n    print(\" 数据每 %d 秒缓存一次，页面上点“立即刷新”可强制更新\" % args.ttl)\n    print(\" 按 Ctrl+C 停止服务\")\n    print(\"=\" * 58)\n    print(\"首次抓取数据中 ...\")\n    first = get_payload(ttl=args.ttl, force=True)\n    print(\"数据就绪：%s（大盘指数 %s 点）\" % (first.get(\"data_time\"), first.get(\"index\", {}).get(\"current\")))\n    if not args.no_open:\n        threading.Timer(0.6, lambda: webbrowser.open(url)).start()\n    try:\n        httpd.serve_forever()\n    except KeyboardInterrupt:\n        print(\"\\n已停止。\")\n    finally:\n        httpd.server_close()\n\n\nif __name__ == \"__main__\":\n    main()\n"};</script><script>window.__STATIC_DATA__   function fmtInt(v) { return Number(v).toLocaleString("zh-CN", { maximumFractionDigits: 0 }); }
  function fmtMoney(v) {
    var a = Math.abs(v);
    if (a >= 1e8) return (v / 1e8).toFixed(2) + " 亿";
    if (a >= 1e4) return (v / 1e4).toFixed(1) + " 万";
    return fmtInt(v);

  function fmtPeople(v) {
    if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + " 万";

  function renderVerdict(d) {

  function renderSignals(d) {

  }

  function renderTables(d) {

    $("tblCats").innerHTML = html + '</tbody>';

  function copyText(text, btn) {
    function done(okText) {
      var old = btn.textContent;
      btn.textContent = okText;
      setTimeout(function () { btn.textContent = old; }, 1400);
    }
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done("已复制");
      } catch (e) { done("复制失败"); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done("已复制"); }, fallback);
    } else { fallback(); }
  }

  function download(name, text, mime) {
    var blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });

    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }
